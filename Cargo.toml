[workspace]
members = [
  "crates/lkjstr-core",
  "crates/lkjstr-engine-worker",
  "crates/lkjstr-host",
  "crates/lkjstr-nips",
  "crates/lkjstr-protocol",
  "crates/lkjstr-xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Shared-host build artifacts must stay within the 25 GiB workspace budget.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
