# The browser app is the root package so Trunk can build it from index.html.
[package]
name = "lkjstr-web"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "crates/lkjstr-web/src/lib.rs"

[dependencies]
js-sys = "0.3.99"
leptos = { version = "0.8.19", features = ["csr"] }
lkjstr-core = { path = "crates/lkjstr-core" }
lkjstr-engine = { path = "crates/lkjstr-engine", default-features = false }
lkjstr-protocol = { path = "crates/lkjstr-protocol" }
send_wrapper = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = [
  "BinaryType",
  "Clipboard",
  "CloseEvent",
  "CssStyleDeclaration",
  "Document",
  "DomStringList",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCollection",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "IdbCursorDirection",
  "IdbCursorWithValue",
  "IdbDatabase",
  "IdbFactory",
  "IdbIndex",
  "IdbIndexParameters",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "KeyboardEvent",
  "Location",
  "History",
  "PopStateEvent",
  "MediaQueryList",
  "MessageEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "VisibilityState",
  "WebSocket",
  "Window",
  "WheelEvent",
  "Storage",
  "StorageEvent",
  "ResizeObserver",
] }

[workspace]
members = [
  ".",
  "crates/lkjstr-core",
  "crates/lkjstr-engine",
  "crates/lkjstr-host",
  "crates/lkjstr-nips",
  "crates/lkjstr-protocol",
  "crates/lkjstr-xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
