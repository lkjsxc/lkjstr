services:
  lkjstr:
    image: ${LKJSTR_IMAGE:?Set LKJSTR_IMAGE to the verified image digest}
    restart: unless-stopped
    init: true
    read_only: true
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:18879:8080'
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, lkjstr-host, probe, '127.0.0.1:8080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
