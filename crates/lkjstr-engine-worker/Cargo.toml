[package]
name = "lkjstr-engine-worker"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
[lints]
workspace = true
[lib]
name = "lkjstr_engine"
crate-type = ["cdylib", "rlib"]
[dependencies]
serde-wasm-bindgen = "0.6.5"
getrandom = { version = "0.2.17", features = ["js"] }
lkjstr-nips = { path = "../lkjstr-nips" }
lkjstr-core = { path = "../lkjstr-core" }
lkjstr-protocol = { path = "../lkjstr-protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
js-sys = "0.3.99"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = [
 "FormData", "Blob", "BlobPropertyBag",
 "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageBitmap", "ImageEncodeOptions", "ImageData",
 "RequestMode", "RequestCredentials", "ReferrerPolicy", "ResponseType",
 "Request", "RequestInit", "RequestRedirect", "Response", "Headers", "AbortController", "AbortSignal", "EventTarget",
 "ReadableStream", "ReadableStreamDefaultReader",
 "WebSocket", "CloseEvent", "MessageEvent", "Event", "DedicatedWorkerGlobalScope", "SharedWorkerGlobalScope",
 "WorkerGlobalScope", "MessagePort", "IdbFactory", "IdbDatabase", "IdbRequest",
 "IdbOpenDbRequest", "IdbVersionChangeEvent", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore",
 "IdbObjectStoreParameters", "IdbKeyRange", "IdbIndex", "IdbCursorWithValue", "IdbCursorDirection",
 "DomStringList", "Performance"
] }
[features]
harness = []
