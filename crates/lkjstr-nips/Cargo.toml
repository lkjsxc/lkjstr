[package]
name = "lkjstr-nips"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Pure, host-independent Nostr protocol codecs and client policy"

[dependencies]
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
base64 = "0.22.1"
bech32 = "0.11.1"
chacha20 = "0.9.1"
chacha20poly1305 = { version = "0.10.1", default-features = false }
scrypt = { version = "0.11.0", default-features = false }
unicode-normalization = "0.1.25"
hkdf = "0.12.4"
hmac = "0.12.1"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr", "ecdh", "ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
